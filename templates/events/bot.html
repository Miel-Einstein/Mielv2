{% extends "base_app.html" %}{% load static miel %}
{% block title %}Assistant · {{ event }}{% endblock %}
{% block main %}
<div class="wrap">
  <div class="bot-layout">
    <div class="chat">
      <div class="chat-head">
        <div class="avatar" aria-hidden="true">🍯</div>
        <div class="who"><b>Miel</b><span id="chatState">…</span></div>
        <button class="btn sm ghost" id="bMenu" type="button">☰ Menu</button>
        <button class="btn sm ghost" id="bPause" type="button">⏸ Pause</button>
        <button class="btn sm ghost" id="bPrev" type="button" title="Aperçu">👁</button>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="composer" id="composer"></div>
    </div>
    <div class="preview-col" id="pvCol"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.EVENT={{ event_json|to_json }};</script>
<script src="{% static 'miel/js/bot.js' %}"></script>
{% endblock %}
