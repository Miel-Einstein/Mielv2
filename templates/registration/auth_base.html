<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Miel{% endblock %}</title>
{% include "partials/ui_i18n_head.html" %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%9D%3C/text%3E%3C/svg%3E">
<style>
/* Design des pages de connexion et d'inscription de Miel (repris du modèle existant) */
html{height:100%}
body{margin:0;padding:0;min-height:100%;font-family:sans-serif;background:linear-gradient(#92187c,pink);display:flex;align-items:center;justify-content:center}
.login-box{width:min(400px,calc(100% - 32px));margin:24px 0;padding:40px;box-sizing:border-box;background:rgba(0,0,0,.5);box-shadow:0 15px 25px rgba(0,0,0,.6);border-radius:10px}
@media (max-width:420px){.login-box{padding:28px 22px}}
.ui-flags{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:10}.ui-flags a{color:#fff;text-decoration:none;font-size:13px;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25)}.ui-flags a.on{background:#f4c003;color:#2c1028;border-color:#f4c003;font-weight:bold}
.login-box .intro{color:#f8e6f3;font-size:14.5px;line-height:1.55;margin:-10px 0 24px;text-align:center}.login-box .forgot{display:block;margin:-18px 0 6px;text-align:right;color:#f4c003;font-size:13.5px}
.login-box h2{margin:0 0 30px;padding:0;color:#fff;text-align:center}
.login-box .user-box{position:relative}
.login-box .user-box input{width:100%;padding:10px 0;font-size:16px;color:#fff;margin-bottom:30px;border:none;border-bottom:1px solid #fff;outline:none;background:transparent;box-sizing:border-box}
.login-box .user-box input:focus{border-bottom-color:#f4c003}
.login-box .user-box input::placeholder{color:rgba(255,255,255,.7)}
.login-box .anim-btn{position:relative;display:inline-block;padding:10px 20px;color:#f4c003;font-size:16px;text-decoration:none;text-transform:uppercase;overflow:hidden;transition:.5s;margin-top:20px;letter-spacing:4px;background:transparent;border:none;cursor:pointer;font-family:inherit}
.login-box .anim-btn:hover,.login-box .anim-btn:focus-visible{background:#f49803;color:#fff;border-radius:5px;box-shadow:0 0 5px #f4c803,0 0 25px #bd9d0b,0 0 50px #f4e403,0 0 100px #d5cf1e;outline:none}
.login-box .anim-btn span{position:absolute;display:block}
.login-box .anim-btn span:nth-child(1){top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#f4c003);animation:btn-anim1 1s linear infinite}
@keyframes btn-anim1{0%{left:-100%}50%,100%{left:100%}}
.login-box .anim-btn span:nth-child(2){top:-100%;right:0;width:2px;height:100%;background:linear-gradient(180deg,transparent,#f4bc03);animation:btn-anim2 1s linear infinite;animation-delay:.25s}
@keyframes btn-anim2{0%{top:-100%}50%,100%{top:100%}}
.login-box .anim-btn span:nth-child(3){bottom:0;right:-100%;width:100%;height:2px;background:linear-gradient(270deg,transparent,#f4dc03);animation:btn-anim3 1s linear infinite;animation-delay:.5s}
@keyframes btn-anim3{0%{right:-100%}50%,100%{right:100%}}
.login-box .anim-btn span:nth-child(4){bottom:-100%;left:0;width:2px;height:100%;background:linear-gradient(360deg,transparent,#f4b003);animation:btn-anim4 1s linear infinite;animation-delay:.75s}
@keyframes btn-anim4{0%{bottom:-100%}50%,100%{bottom:100%}}
.login-box .alt{display:block;margin-top:22px;color:#f8d9f0;font-size:14px;text-align:center}
.login-box .alt a{color:#f4c003}
.eye-icon{cursor:pointer;position:absolute;right:4px;bottom:35px;color:#fff;font-size:1.2rem;background:none;border:none;padding:4px}
.error-message{color:#ffd2c2;background:rgba(180,60,30,.45);padding:8px 12px;border-radius:8px;margin:10px 0;font-size:.85rem;text-align:center}
.terms-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);align-items:center;justify-content:center;z-index:1000;padding:20px}
.terms-modal.show{display:flex}
.terms-modal-content{background:#1a0a1a;border-radius:20px;max-width:550px;width:100%;max-height:80vh;overflow-y:auto;animation:modalSlideIn .3s ease;border:1px solid #f4c003;box-shadow:0 0 30px rgba(244,192,3,.3)}
@keyframes modalSlideIn{from{opacity:0;transform:scale(.95) translateY(-20px)}to{opacity:1;transform:none}}
.terms-header{background:linear-gradient(135deg,#92187c,#6b0f5a);color:#f4c003;padding:20px 25px;position:sticky;top:0;text-align:center;border-bottom:2px solid #f4c003}
.animated-bee{display:inline-block;animation:flyBee 2s ease-in-out infinite;font-size:2.5rem;margin-right:10px}
@keyframes flyBee{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-10deg)}75%{transform:translateY(8px) rotate(10deg)}}
.terms-header h3{margin:0;font-size:1.5rem;display:inline-block}
.terms-close{position:absolute;top:12px;right:16px;font-size:1.8rem;cursor:pointer;color:#f4c003;background:none;border:none}
.terms-body{padding:25px;color:#f0e0f0;line-height:1.6;font-size:.9rem}
.terms-body h4{color:#f4c003;margin:15px 0 8px}
.terms-body ul{margin:10px 0 15px 20px;padding:0}
.terms-footer{padding:15px 25px;background:#0f0510;display:flex;justify-content:flex-end;gap:15px;border-top:1px solid #f4c003;position:sticky;bottom:0}
.btn-refuse{background:transparent;border:1px solid #aa88aa;color:#ccaaee;padding:10px 25px;border-radius:50px;cursor:pointer}
.btn-accept{background:linear-gradient(135deg,#f4c003,#d4a000);color:#2c1028;border:none;padding:10px 30px;border-radius:50px;cursor:pointer;font-weight:bold}
input:-webkit-autofill,input:-webkit-autofill:focus{transition:background-color 600000s 0s,color 600000s 0s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<nav class="ui-flags" aria-label="Langue">{% for code, flag, name in ui_flags %}<a href="#" data-ui="{{ code }}" class="{% if code == ui_lang %}on{% endif %}" title="{{ name }}" translate="no">{{ flag }} {{ code|upper }}</a>{% endfor %}</nav>
{% block body %}{% endblock %}
<script>
document.querySelectorAll('.ui-flags a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.cookie='miel_ui='+a.dataset.ui+';path=/;max-age=31536000;SameSite=Lax';location.reload();}));
document.querySelectorAll('.eye-icon').forEach(eye=>eye.addEventListener('click',()=>{
  const ins=document.querySelectorAll('.passes');const show=ins[0].type==='password';
  ins.forEach(i=>i.type=show?'text':'password');eye.textContent=show?'🔒':'👁️';eye.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe');
}));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
